{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Velora{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
    
    <!-- Adding Google Fonts for Inter and Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block extra_css %}{% endblock %} 
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="navbar">

        <div class="logo">
            Velora
        </div>

        <nav class="nav-links">
            <a href="{% url 'store:home' %}">Home</a>
            <a href="#">Shop</a>
            <a href="{% url 'store:about' %}">About us</a>
        </nav>

        <div class="nav-actions">

            <div class="search-box">
                <span>⌕</span>
                <input type="text" placeholder="Search something...">
            </div>

            <a href="#" class="nav-icon" title="Account">
                👤
            </a>

            <a href="#" class="nav-icon" title="Shopping Bag">
                ♡
            </a>

            <a href="#" class="nav-icon" title="Cart">
                🛒
            </a>

        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-logo">
            Velora
        </div>

        <div class="footer-links">
            <a href="#">Shop</a>
            <span>•</span>
            <a href="{% url 'store:about' %}">About us</a>
            <span>•</span>
            <a href="#">Contact</a>
        </div>

        <div class="social-icons">
            <a href="#">◎</a>
            <a href="#">f</a>
            <a href="#">◉</a>
        </div>

        <div class="footer-line"></div>

        <p>
            © 2026 Velora. All rights reserved.
        </p>

    </footer>

</body>
</html>
