{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Velora{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'store_app/css/store.css' %}">
    <!-- Adding Google Fonts for Inter and Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>

        <nav class="navbar">

            <a href="{% url 'store_app:home' %}" class="nav-logo">Velora</a>

            <ul class="nav-links">
                <li><a href="{% url 'store_app:home' %}">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="{% url 'store_app:about' %}">About us</a></li>  
            </ul>

            <div class="nav-right">

                <div class="nav-search">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                        <path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="text" placeholder="Search something...">
                </div>

                <div class="nav-icons">

                    <a href="#" aria-label="Account">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </a>

                    <a href="{% url 'store_app:wishlist' %}" aria-label="Wishlist">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 7h12l-1 13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M9 7a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </a>

                    <a href="#" aria-label="Cart">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="9" cy="21" r="1.4" fill="currentColor"/>
                            <circle cx="18" cy="21" r="1.4" fill="currentColor"/>
                            <path d="M2.5 3h2.4l2.1 12h11.2l2-8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>

                </div>

            </div>

        </nav>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-logo">Velora</div>

        <div class="footer-rule"></div>

        <div class="footer-links">
            <a href="#">Shop</a>
            <span class="dot">•</span>
            <a href="{% url 'store_app:about' %}">About us</a>
            <span class="dot">•</span>
            <a href="#">Contact</a>
        </div>

        <div class="footer-social">

            <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="17.2" cy="6.8" r="1" fill="currentColor"/>
                </svg>
            </a>

            <a href="#" aria-label="Facebook">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 8.5h2.5V5H14c-2 0-3.5 1.6-3.5 3.6V11H8v3.5h2.5V21H14v-6.5h2.4l.6-3.5h-3V9.2c0-.5.3-.7.7-.7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="#" aria-label="WhatsApp">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.7-1.2A9 9 0 1 0 12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M8.5 9.5c.3 2.6 2.4 4.7 5 5 1 .1 1-.7.6-1.2l-1-1.2-1.4.5a4.4 4.4 0 0 1-2.3-2.3l.5-1.4-1.2-1c-.5-.4-1.3-.4-1.2.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
            </a>

        </div>

        <hr class="footer-divider">

        <p class="footer-copy">© 2026 Velora. All rights reserved.</p>

    </footer>

    <!-- jQuery CDN (global — loaded on every page) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
