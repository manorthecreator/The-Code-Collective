{% extends "accounts_app/base.html" %}

{% block content %}

<p class="logo">velora</p>

<h1>Welcome Back</h1>

<p class="subtitle">
    Please login to your account
</p>


<form class="login-form" method="POST" action="{% url 'accounts_app:login' %}">

    {% csrf_token %}

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <div class="input-group">
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="input-group">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >
    </div>

    <div class="forgot-password">
        <a href="#">Forgot Password?</a>
    </div>

    <button type="submit">Login</button>

</form>

<div class="or-divider">
    <span></span>
    <p>Or login with</p>
    <span></span>
</div>

<div class="social-login">

    <button type="button">
        <i class="fa-brands fa-google"></i>
        Google
    </button>

    <button type="button">
        <i class="fa-brands fa-facebook-f"></i>
        Facebook
    </button>

</div>

<p class="signup-text">
    Don't have an account?
    <a href="{% url 'accounts_app:register' %}">Sign Up</a>
</p>

{% endblock %}
