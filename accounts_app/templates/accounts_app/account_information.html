
{% extends "store_app/base.html" %}
{% load static %}

{% block title %}My Account | Velora{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/account.css' %}">
{% endblock %}

{% block content %}
<section class="account-page">

    <div class="account-heading">
        <h1>My Account</h1>
        <p>Manage your personal information.</p>
    </div>

    <div class="account-layout">

        <aside class="account-sidebar">
            <a href="#account-details" class="sidebar-link active">
                Account Details
            </a>
        </aside>

        <div class="account-content" id="account-details">

           <form method="POST" action="{% url 'accounts_app:account' %}" class="account-form">
            {% csrf_token %}

                <div class="name-row">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name"
                               name="first_name"
                               value="{{ request.user.first_name }}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name"
                               name="last_name"
                               value="{{ request.user.last_name }}"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           value="{{ request.user.email }}" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter a new password ">
                </div>

                <div class="account-actions">
                    <button type="submit" class="save-button">
                        Save Changes
                    </button>

                    <button type="reset" class="cancel-button">
                        Cancel
                    </button>
                </div>

            </form>

        </div>
    </div>

</section>
{% endblock %}
