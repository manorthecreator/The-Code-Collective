{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Velora</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<main class="login-container">

    <!-- LEFT SIDE - COMMON -->
    <section class="login-image">
        <img src="{% static 'images/login_image.png' %}" alt="Velora">
    </section>

    <!-- RIGHT SIDE -->
    <section class="login-content">

        {% block content %}
        {% endblock %}

    </section>

</main>

</body>
</html>
